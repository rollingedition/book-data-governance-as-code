# Spoken descriptions for chapter 9, Governing data for AI. Narration reads these in place of the code and its output.

[examples.corpus-consent-filter]
say = "The code counts the reviews that three builds of the corpus would hold. The plain pipeline copies all {{out:corpus-consent-filter:reviews the plain pipeline copies}}, the governed read through the enforcement layer, as analyst-1 with AI training as its purpose, gets {{out:corpus-consent-filter:reviews the governed build reads, as analyst-1 for ai-training}}, and a filter written by hand that leaves out the learners who said no keeps {{out:corpus-consent-filter:reviews a filter on refusals keeps}}, {{out:corpus-consent-filter:share by learners never asked}} of them by learners never asked. A read without the purpose returns every review with none of its text, and the plain copy's text holds {{out:corpus-consent-filter:plain pipeline, labelled EMAIL_ADDRESS values}} labelled emails and {{out:corpus-consent-filter:plain pipeline, labelled PERSON values}} labelled names."

[examples.corpus-personal-data-left]
say = "The code takes the reviews the corpus reads, already masked by the enforcement layer, and counts the labelled names and emails still in their text after each step: the mask, then the pattern recognizers, then a deny list of the instructors' names. Only the list removes names, leaving {{out:corpus-personal-data-left:then the instructors' names, PERSON left}}, with {{out:corpus-personal-data-left:false positives, instructors' names}} false positives. A longer list with every learner's name in it makes {{out:corpus-personal-data-left:false positives, with learners' names}} false positives matched in any case, and {{out:corpus-personal-data-left:false positives, with learners' names, matching case}} matched only as written."

[examples.privacy-filter-on-the-corpus]
say = "The code scores OpenAI's Privacy Filter, from a recording of its detections, against the labelled spans in the {{out:privacy-filter-on-the-corpus:reviews measured}} reviews the corpus reads, with each of the model's labels mapped to an entity type. Of {{out:privacy-filter-on-the-corpus:labelled names}} labelled names, it finds {{out:privacy-filter-on-the-corpus:names the model finds, exactly}} exactly and misses {{out:privacy-filter-on-the-corpus:names the model misses}}, and {{out:privacy-filter-on-the-corpus:of them, overlapping no labelled span of their type}} of its {{out:privacy-filter-on-the-corpus:the model's detections}} detections fall outside a labelled span of their type."

[examples.keyed-pseudonyms]
say = "The code takes two of the corpus's reviews that name the instructor Patrick and replaces the name with Presidio's hash operator, which gives it a different value in each review and again when one review is hashed twice. Presidio refuses a fixed salt of ten bytes as too short, while the corpus job's keyed hash gives both reviews the same pseudonym, and the name typed in lowercase the same one. The enforcement layer's pseudonymize mask turns the name into a different value, a long hex digest, and the code counts {{out:keyed-pseudonyms:HMAC functions in DuckDB}} HMAC functions in DuckDB."

[examples.corpus-duplicates]
say = "The code pseudonymizes the reviews the corpus reads, removes exact copies, then finds near-duplicate pairs with MinHash LSH and confirms each one by its exact Jaccard similarity. Of {{out:corpus-duplicates:reviews read}} reviews, {{out:corpus-duplicates:exact duplicates removed}} are exact copies, and of the {{out:corpus-duplicates:near-duplicate pairs from LSH}} candidate pairs LSH proposes, {{out:corpus-duplicates:near-duplicate pairs confirmed}} are confirmed and {{out:corpus-duplicates:of them, differing only in a name}} of those differ only in a name, so it removes {{out:corpus-duplicates:near-duplicates removed}} near-duplicates. The corpus keeps {{out:corpus-duplicates:records kept}} records, {{out:corpus-duplicates:records that stand for reviews of several courses}} of them standing for reviews of several courses."

[examples.names-and-near-duplicates]
say = "The code takes the corpus's reviews three ways, with names as written, with keyed pseudonyms and with plain placeholders, and counts each way's pairs of distinct texts at a similarity of 0.8 or more: {{out:names-and-near-duplicates:names as written, pairs at 0.8 or more}}, {{out:names-and-near-duplicates:keyed pseudonyms, pairs at 0.8 or more}} and {{out:names-and-near-duplicates:placeholders, pairs at 0.8 or more}}. Then it compares every pair of distinct pseudonymized texts and finds {{out:names-and-near-duplicates:pairs that differ only in a name}} that differ only in a name, the shorter ones under the threshold and the longer ones at or over it. The most similar pair that differs in more than a name reaches {{out:names-and-near-duplicates:the most similar pair that differs in more than a name}}."

[examples.lsh-misses-near-duplicates]
say = "The code compares all {{out:lsh-misses-near-duplicates:pairs compared exactly}} pairs of distinct texts exactly and finds {{out:lsh-misses-near-duplicates:pairs at a Jaccard similarity of 0.8 or more}} at 0.8 or more, then runs LSH tuned for 0.8 and for 0.6, under datasketch's affine32 hashing and its legacy hashing, and counts the pairs each setting misses. Tuned for 0.8, the affine32 index misses {{out:lsh-misses-near-duplicates:affine32, LSH tuned for 0.8, missed}}, and the formula gives a pair at 0.8 a chance of {{out:lsh-misses-near-duplicates:chance of a candidate at similarity 0.8, LSH tuned for 0.8}} of becoming a candidate. Tuned for 0.6, the misses fall to {{out:lsh-misses-near-duplicates:affine32, LSH tuned for 0.6, missed}} under affine32 and {{out:lsh-misses-near-duplicates:legacy, LSH tuned for 0.6, missed}} under the legacy hashing, and datasketch refuses a legacy sketch in an affine32 index."

[examples.corpus-provenance]
say = "The code builds the corpus and follows one record back: its source table, review {{out:corpus-provenance:its review_id}}, the job that wrote it, and a run ID that matches the run in the job's complete event. That event's lineage says the learners' consent answer and the reviews' learner ID decide which rows exist, and that the text was transformed, while the pipeline's SQL as written filters nothing and copies the text unchanged. Joined back to their authors, {{out:corpus-provenance:records whose author consented}} records have an author who consented."

[examples.corpus-dataset-card]
say = "The code builds the corpus and generates its Croissant card twice: first with mlcroissant's default, which declares an older version of Croissant, then with Croissant 1.1 and its responsible-AI vocabulary written out. The card takes its publication date, version, sources, run and preprocessing counts from the build. Every warning mlcroissant gives, {{out:corpus-dataset-card:mlcroissant's warnings}} in all, is about a recommended property, here a citation, and the platform's own check finds what none of them says: the card has no creator."

[examples.consent-withdrawn-after-build]
say = "The code builds the Oct 1 corpus and its card, withdraws the consent of the author of one of its records, and rebuilds the corpus in the same folder the next night without a new card. The Oct 2 build holds {{out:consent-withdrawn-after-build:Oct 2 build, records from the learner who withdrew}} records by that learner, and checked against today's consent, the Oct 1 build has {{out:consent-withdrawn-after-build:Oct 1 build, records whose author consents today}} records whose author consents. The file now holds {{out:consent-withdrawn-after-build:records in the corpus file now}} records, and the Oct 1 card, checked against it, has {{out:consent-withdrawn-after-build:problems with the Oct 1 card, checked against the corpus now}} problems: no creator, and a hash that no longer matches the file."

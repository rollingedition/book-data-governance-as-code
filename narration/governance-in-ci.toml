# Spoken descriptions for chapter 10, Governance in CI. Narration reads these in place of the code, its output and the
# chapter's tables.

[[tables]]
section = "run-every-rule-as-one-job"
starts = '| Check | From | Fails when |'
say = "The table lists the job's {{out:governance-ci-report:checks run}} checks in the order they run, with the chapter each comes from and what fails it. Coverage, from chapters 2 and 3, fails on a table with no metadata or owner, or a column with no classification or one below its name's suggestion. This chapter's contract rules and contracts checks fail on a contract that breaks a global or a domain rule and on a generated file out of date, chapter 5's policy tests on a failing Rego test or who-sees-what row, chapter 6's enforcement tests on a failing regression case or who-sees-what query, and the migrations check on a migration Iceberg refuses. Then chapter 4's pipelines check fails on a pipeline that can't run or whose lineage can't be read, and its lineage check on a column declared less protected than lineage proposes. This chapter's owner review fails on a lowered classification or a change of owner or domain nobody approved, and its removals check on a column removed before it was deprecated. Last, chapter 7's properties check fails on a table that lacks its generated properties."

[examples.governance-ci-report]
say = "The code copies the main branch into a pull request's branch, adds one migration that gives the learners table a work email column, and runs the governance job as a CI step does. It prints a line for each check and each finding, then the totals: {{out:governance-ci-report:checks failed}} of {{out:governance-ci-report:checks run}} checks fails, coverage, on the new column, which has no classification, and the step exits with code {{out:governance-ci-report:the step exits with}}. Last comes the Markdown summary for the pull request: a table of the checks, the finding to fix, the {{out:governance-ci-report:findings already on main}} findings already on main with the team that owns each, and the schema change."

[examples.schema-change-impact]
say = "The code renames the courses table's category column to subject on a branch, in a migration and in the metadata file under the same field ID, builds both sides and compares their schemas. An Iceberg reader on the branch still finds a subject for {{out:schema-change-impact:courses whose subject an Iceberg reader finds}} courses, but both pipelines that name the column stop on an unknown column, and through lineage the rename reaches {{out:schema-change-impact:columns whose values come from it}} columns by value and {{out:schema-change-impact:columns it can change, DIRECT and INDIRECT}} through every edge. Then the code fixes both pipelines to read subject and generates the contracts again, and the job passes."

[examples.classification-downgrade]
say = "The code lowers the learners table's city column from personal to internal in a branch's metadata file, and asks the access policy on each side what analyst-1 gets reading it: pseudonymized on main, unmasked on the branch. With {{out:classification-downgrade:schema changes}} schema changes, the policy tests, the enforcement tests and the removals check pass, and only the owner review fails, since team-crm, which owns the table, hasn't approved. Given approvals, it passes with team-crm's and fails with team-analytics'; once team-crm asks for two in the job's settings, it passes only with two of team-crm's."

[examples.deprecate-then-remove]
say = "The code removes the payments table's card number column twice, each time dropping it in a migration and deleting its metadata entry: once from the main branch as it is, and once on top of a pull request that marks the column deprecated and says to reconcile payments by the payment ID instead. The removals check fails the first, since main never deprecated the column, and passes the second. Then the code prints the column's entry in that pull request's ODCS contract: its field ID, name and type, its sensitive classification, the description with the deprecation note, and the deprecated flag set to true."

[examples.domain-contracts]
say = "The code lowers the city column on a branch again and asks whom GitHub would request: with one rule for the whole governance folder, the metadata file's review goes to the platform team. It prints the learners table's generated contract, in the crm domain with team-crm as owner, and the generated CODEOWNERS file: the platform team's paths first, then the analytics team's pipelines, and a folder of contracts for each of the {{out:domain-contracts:teams that own tables}} teams that own tables. The contracts check fails until the code generates the {{out:domain-contracts:files generated again}} files again, and then the learners contract's review goes to team-crm."

[examples.global-and-domain-rules]
say = "The code adds the work email column on a branch, classified public with an empty description, and runs coverage and the contract rules, from the global rules file and the crm domain's rules file. Coverage fails the public classification, which needs team-crm's approval, and the contract rules fail: the global rule wants a description, and the crm rule allows no public column. On a second try, with a description and the learners table moved to the analytics domain, the contract rules pass, while coverage still fails and the owner review fails the change of domain."

[examples.waived-findings]
say = "The code adds waivers to the CRM team's pull request in two tries. A waiver for the unclassified work email column silences nothing, since coverage findings are never waived. With the column classified personal but not described, a waiver for the missing description that runs to June 30, 2027 is refused, as past the longest allowed; shortened to the end of October, it waives {{out:waived-findings:undescribed, asked until 2026-10-31, on 2026-10-01, findings waived}} finding on the book's today, October first, and {{out:waived-findings:undescribed, asked until 2026-10-31, on 2026-11-01, findings waived}} on November first, once it has expired."

[examples.slow-check-every-row]
say = "The code adds two columns to the support tickets table on a branch, a callback number classified internal and a reply email classified public, then runs coverage beside two checks that classify the table's values, one on a sample and one on every row. Coverage fails the reply email by its name; the callback number holds {{out:slow-check-every-row:support.tickets.callback_number, values on the branch}} values, so neither value check flags it, and both find the ticket body sensitive, the sampled check after reading {{out:slow-check-every-row:classify-sampled, values read}} values, the every-row check after {{out:slow-check-every-row:classify-every-row, values read}}. Then the code counts what each would read across the described tables' text columns: {{out:slow-check-every-row:values the sampled check would read in them}} values by sample, and {{out:slow-check-every-row:values the every-row check would read in them}} by every row."

[examples.noisy-check-waivers]
say = "The code adds a check to the job's settings that treats every column named like an ID as personal, and runs the job, which fails: the check finds {{out:noisy-check-waivers:id-columns, findings}} columns, {{out:noisy-check-waivers:id-columns, findings classified internal}} classified internal and {{out:noisy-check-waivers:id-columns, findings classified public}} public, the courses table's course ID. Once the code writes a waiver for each finding, the waivers file holds {{out:noisy-check-waivers:waivers in the file, after}} waivers and the job passes. The last lines give each check's share of findings nobody acted on: the ID check's are all waived, and those of coverage and the properties check all sit on main."

[examples.broken-files-become-findings]
say = "The code makes a pull request that adds a support agent to the users file with a closing quote missing, adds the work email column, and changes the learners table's country column from text to a number, then runs the whole job. The policy tests and the enforcement tests each fail with one finding, that the check could not run, because the users file doesn't parse; the migrations check fails because Iceberg refuses the type change; and coverage fails on the unclassified column. Apart from those two tests, every check runs, {{out:broken-files-become-findings:checks that ran}} in all, and the job exits with code {{out:broken-files-become-findings:exit code}}."

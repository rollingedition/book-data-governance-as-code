# Spoken descriptions for chapter 8, Audit and evidence. Narration reads these in place of the code and its output.

[examples.decision-record]
say = "The code sends two of the course assistant's queries through the audited layer as instructor-17: review counts and average ratings per course, which the policy allows, then a join of reviews to learners' names, which it denies. It prints each record field by field: its number, its time in UTC, the user and the assistant that sent the query, the query with its values replaced, the outcome, each table's decision with its filters, masks and reasons, and the hashes that tie the record to its policy, its rewritten query and the record before it. The denial holds both tables' decisions, reviews allowed and learners not."

[examples.query-without-literals]
say = "The code has agent-a05 look up an EMEA learner by email, then by ID, and analyst-1 read learners' emails, and prints each record's query, with a question mark where the email and the ID were. The email isn't in the audit log, but DuckDB's query log holds it, while the pseudonymization key appears there only as its placeholder. Then the code rebuilds the query DuckDB ran with each of {{out:query-without-literals:emails tried}} emails: a plain SHA-256 confirms {{out:query-without-literals:emails a plain SHA-256 of the query confirms}} of them, and the record's keyed digest confirms {{out:query-without-literals:emails the keyed digest confirms, without the layer's key}} without the layer's key and {{out:query-without-literals:emails the keyed digest confirms, with the layer's key}} with it."

[examples.query-shape-hard-cases]
say = "The code types an EMEA learner's email, name and ID into agent-a05's queries in each of these places: three kinds of string, a list, a number, a comment, a name in double quotes, a column alias, a table alias, a CTE's name and a table the catalog doesn't hold. For each it prints what the record keeps: a question mark where a value was, a numbered alias where a name was, no comment, and the denied queries' reasons with the same values taken out. Records that still hold the email, the name or the ID: {{out:query-shape-hard-cases:records holding the email, the name or the ID}}."

[examples.explain-old-decision]
say = "The code logs analyst-1's read of learners' emails, which the policy pseudonymizes, then adds analyst-1 to support for EMEA, a change to the users file alone. The policy revision changes, though only the data document did, not the policy modules. Replayed under the current revision, the decision shows the email as stored and no longer matches the log; replayed under the logged revision, fetched from the archive, it pseudonymizes the email again and matches."

[examples.chain-catches-edit]
say = "The code replays the day's {{out:chain-catches-edit:records}} queries into a chained log and writes its head down at noon, at record {{out:chain-catches-edit:head written down at noon, at record}}. Then it tampers with copies: before noon it hands record three to another agent, after noon it removes record twelve, each once plainly and once with the chain rebuilt, and it cuts off the last two records, then checks each copy alone and against the noon head. The plain edit and the plain removal show either way, the rebuilt edit shows only against the head, and the rebuilt removal and the cut pass both checks."

[examples.query-log-cross-check]
say = "The code replays the day's queries through the audited layer and matches DuckDB's own query log against the records: DuckDB ran {{out:query-log-cross-check:queries DuckDB ran}} queries, {{out:query-log-cross-check:queries DuckDB ran with no decision record}} of them without a record. Then it sends two more queries through the layer, one never fetched and one narrowed to five rows, and reads a learner's email on the layer's connection, around the layer. The next check finds {{out:query-log-cross-check:next check, queries with no decision record}} query with no decision record, the email lookup with its value replaced, and {{out:query-log-cross-check:next check, decision records DuckDB has no query for}} decision records with no query in DuckDB's log."

[examples.access-review]
say = "The code replays the day's queries, adds analyst-2 to the users file in a group the policy no longer has, and reviews all {{out:access-review:users reviewed}} users against the platform's eight tables. For each user it prints how many tables they may read and how many they read, their denied queries and the assistant that sent them, the grants they didn't use, and anything to look at. Over the day, {{out:access-review:grants not used}} grants go unused, and {{out:access-review:users to look at}} users need a look: analyst-2 for the unknown group, someone-else for not being in the users file, and instructor-17 for denied queries, all sent by the assistant, that reach the flagging threshold of {{out:access-review:denied queries flagged at}}."

[examples.evidence-report]
say = "The code erases one learner as chapter 7 did, logs the erasure at seven in the morning, replays the day's queries, and generates the first evidence report as a file of data, in sections from the policy to the access review. The policy passes {{out:evidence-report:policy tests passed}} unit tests and agrees with {{out:evidence-report:who-sees-what cases the policy agrees with}} who-sees-what cases, the coverage section names the tables with no metadata, the chain has {{out:evidence-report:chain problems, checked alone}} problems checked alone, and the erasure's line reads {{out:evidence-report:erasure erasure-0001}}. The report writes the chain's head down at record {{out:evidence-report:chain head written down, at record}}, and says which part of the engine cross-check nobody can compute again: the reading of DuckDB's log, which the layer emptied."

[examples.query-log-switched-off]
say = "The code builds two audited layers, one that doesn't lock its configuration and one that does, and on each has code holding the connection read a learner's email around the layer. On the unlocked one, DuckDB refuses a query log in a file with a permission error, but switching logging off works, and the cross-check finds only the refused setting and the switch-off, not the read. On the locked one, switching off fails with an invalid input error, but emptying DuckDB's log works: the check then finds {{out:query-log-switched-off:locked, after truncate_duckdb_logs(), queries with no decision record}} unrecorded queries, and {{out:query-log-switched-off:locked, decision records DuckDB has no query for}} decision record with no query, which shows that something emptied the log."

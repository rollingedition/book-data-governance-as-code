# Spoken descriptions for chapter 7, Retention, consent and erasure. Narration reads these in place of the code, its
# output and the chapter's fenced blocks.

[[blocks]]
section = "retention-rules-in-a-file"
starts = '[tables."support.tickets"]'
say = "The retention file holds one rule per table. Support tickets are kept 730 days, counted from when they were opened, and only once their status is closed, with a note that tickets record when they were opened, not when they were closed. Learning events are kept 365 days from when they occurred, and payments 3,650 days from when they were paid, a placeholder for the period the platform's legal team sets for payment records."

[examples.retention-rules-due]
say = "The code reads the retention file, turns each table's rule and a given day into a filter on the column the rule counts from, and counts the rows due on the book's today, October 1, 2026, and ninety days later. On the first day, {{out:retention-rules-due:learning.events on 2026-10-01, rows due}} of the {{out:retention-rules-due:learning.events on 2026-10-01, rows in the table}} events and {{out:retention-rules-due:support.tickets on 2026-10-01, rows due}} tickets are due. On the second, {{out:retention-rules-due:learning.events on 2026-12-30, rows due}} events and {{out:retention-rules-due:support.tickets on 2026-12-30, rows due}} tickets are due."

[examples.apply-retention]
say = "The code applies the retention rules for October 1, 2026, twice. The first run deletes {{out:apply-retention:learning.events, rows deleted}} events and {{out:apply-retention:support.tickets, rows deleted}} tickets, writing the other {{out:apply-retention:learning.events, rows written again to delete the others}} events again to do it, and the second run deletes {{out:apply-retention:rows deleted by running again for the same day}} rows. Read by time travel to the snapshot before the delete, the events table still returns all {{out:apply-retention:learning.events, rows due, read by time travel}} expired events, and expiring its snapshots by the table's own age setting removes {{out:apply-retention:learning.events, snapshots expired by age today}} straight away and {{out:apply-retention:learning.events, snapshots expired by age six days later}} six days later."

[examples.consent-withdrawal]
say = "The code builds the marketing audience, sets learner 3590's marketing consent to false in the learners table, as the CRM's sync would, and then builds the audience again. Through the enforcement layer, marketing sees {{out:consent-withdrawal:before, learners marketing sees}} learners before the withdrawal and {{out:consent-withdrawal:after the withdrawal, learners marketing sees}} after it, while the learners table still stores {{out:consent-withdrawal:after the withdrawal, rows stored in crm.learners}} rows. The learner's rows in the audience table go from {{out:consent-withdrawal:after the withdrawal, learner 3590's rows in marketing.audience}} after the withdrawal to {{out:consent-withdrawal:after the audience is built again, learner 3590's rows in marketing.audience}} only once the audience is built again."

[[blocks]]
section = "plan-erasure-from-lineage"
starts = '[erasure.exceptions."billing.payments"]'
say = "The retention file's exception for the payments table gives its reason, a placeholder for a legal obligation to keep payment records, such as tax records, which the legal team replaces with the obligation and the law it comes from. It records that the legal team decided it, a role and never a person's name, and lists one column to erase at once, the card number. An empty list would keep the whole row."

[examples.erasure-plan]
say = "The code plans learner 3590's erasure on the platform as the request finds it, and prints one step per table: delete by the learner's ID, delete by an ID that lineage shows is copied, run the table's job again, or keep the rows under an exception. The plan holds {{out:erasure-plan:tables in the plan}} tables, {{out:erasure-plan:tables found by their learner_id column}} found by their learner ID column and {{out:erasure-plan:tables found by lineage}} by lineage, and keeps the learner's {{out:erasure-plan:the learner's rows in billing.payments}} payments with the card number erased. A search of the text the plan doesn't delete finds {{out:erasure-plan:rows the plan doesn't delete whose text names the learner}} rows that name the learner."

[examples.erase-learner]
say = "The code carries out the plan under one request ID, then reads the learners and events tables as they are now and by time travel to the snapshot before the erasure. It deletes {{out:erase-learner:learning.events, rows deleted}} events and {{out:erase-learner:learning.enrollments, rows deleted}} enrollments among the rest, and keeps the learner's {{out:erase-learner:billing.payments, the learner's rows kept}} payments, with {{out:erase-learner:billing.payments, card numbers left in them}} card numbers left in them. Read now, the learners table holds {{out:erase-learner:the learner's rows in crm.learners, read now}} rows for the learner, but time travel returns {{out:erase-learner:the learner's rows in crm.learners, read by time travel}}, and across the plan's tables, {{out:erase-learner:snapshots that still hold the rows the erasure deleted}} snapshots still hold the deleted rows."

[examples.expiry-ignores-table-settings]
say = "The code gives the learners table {{out:expiry-ignores-table-settings:gc.enabled=false, snapshots}} snapshots, a load and two deletes, twice: once with garbage collection turned off, and once with three snapshots to keep. On each, it runs the book's expiry, then PyIceberg's expiry of every snapshot older than now. The book's expiry refuses the first table and expires {{out:expiry-ignores-table-settings:history.expire.min-snapshots-to-keep=3, the book's expiry expires}} snapshots of the second, while PyIceberg's expiry leaves {{out:expiry-ignores-table-settings:gc.enabled=false, snapshots left by PyIceberg's expiry}} snapshot of the first and {{out:expiry-ignores-table-settings:history.expire.min-snapshots-to-keep=3, snapshots left by PyIceberg's expiry}} of the second, reading neither setting."

[examples.erasure-refuses-to-start]
say = "The code turns off garbage collection on the learners table, sets three snapshots to keep on the events table, and runs the whole erasure job for learner 3590. The job refuses before it changes anything, naming both tables and why, so {{out:erasure-refuses-to-start:tables the job changed}} tables change. The scan of every file then finds the learner in {{out:erasure-refuses-to-start:files holding the learner}} files across {{out:erasure-refuses-to-start:tables whose files hold the learner}} tables."

[examples.sweep-unreferenced-files]
say = "The code erases learner 3590, expires the old snapshots of the plan's tables, and sweeps the files no metadata references, first with the configured minimum age of 72 hours and then with none, and scans every file for the learner after the expiry and after the sweep. Expiry removes {{out:sweep-unreferenced-files:snapshots expired}} snapshots and leaves {{out:sweep-unreferenced-files:files holding the learner, after expiry}} files that hold the learner, the 72-hour sweep deletes {{out:sweep-unreferenced-files:files swept with the configured minimum age}} files, and the sweep with no minimum age deletes {{out:sweep-unreferenced-files:files swept with no minimum age}}. After the sweep, {{out:sweep-unreferenced-files:files holding the learner, after the sweep}} file still holds the learner: a manifest of the learners table, whose entry for the deleted file keeps the learner's email, typed in capitals, as its smallest email bound."

[examples.statistics-off-for-personal-columns]
say = "The code generates each table's properties from the classifications, turning statistics off for {{out:statistics-off-for-personal-columns:columns with statistics turned off}} columns, then erases learner 4998, whose email is the largest bound in the learners table's manifest, on a platform with default statistics and on one with those properties. With default statistics, the manifest keeps bounds for {{out:statistics-off-for-personal-columns:default statistics, of them with bounds in the manifest}} of the table's {{out:statistics-off-for-personal-columns:default statistics, crm.learners personal columns}} personal columns, and after the erasure, expiry and sweep, {{out:statistics-off-for-personal-columns:default statistics, files holding learner 4998 after erasure, expiry and sweep}} file still holds the learner. With statistics off, the manifest keeps bounds for {{out:statistics-off-for-personal-columns:statistics off for protected columns, of them with bounds in the manifest}} of them, and {{out:statistics-off-for-personal-columns:statistics off for protected columns, files holding learner 4998 after erasure, expiry and sweep}} files hold the learner."

[examples.verify-erasure]
say = "The code runs the whole erasure job for learner 3590 on the platform with statistics off for protected columns, then scans every file under the warehouse, table by table. The scan reads {{out:verify-erasure:files read}} files and finds the learner in {{out:verify-erasure:files holding the learner}}, with {{out:verify-erasure:snapshots a reader can still time travel to}} older snapshots left to time travel to and {{out:verify-erasure:files no metadata references}} unreferenced files. The evidence it prints holds the request's ID, {{out:verify-erasure:tables visited}} tables visited, {{out:verify-erasure:rows deleted}} rows deleted and the scan's counts, no value of the learner's, and one warning: the table the job rebuilt lacks its generated properties."

[examples.erased-learner-returns]
say = "The code erases learner 3590 everywhere and adds an entry to the erasure register: the request's ID and a keyed hash of the learner's ID. Then it reloads the learners table from the application's nightly export and runs the pipelines that read it, and the learner's rows in the learners table go from {{out:erased-learner-returns:the learner's rows in crm.learners after the erasure}} to {{out:erased-learner-returns:the learner's rows in crm.learners after the nightly run}}, with {{out:erased-learner-returns:the learner's rows in analytics.learner_activity after the nightly run}} in the learner activity table. The check against the register finds {{out:erased-learner-returns:the check against the register, rows of erased learners in crm.learners}} row of an erased learner in the learners table and {{out:erased-learner-returns:the check against the register, rows of erased learners in analytics.learner_activity}} in the learner activity table."

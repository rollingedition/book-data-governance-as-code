# Spoken descriptions for chapter 6, Enforcing policies on queries. Narration reads these in place of the code and its
# output.

[examples.tables-a-query-reads]
say = "The code asks the enforcement layer which columns four queries read from each table. The query that selects star reads every column of the learners table, the join reads country and learner ID from learners and learner ID from tickets, the query with a CTE reads every learner column but notes, though it returns only email, and the query with names in capitals reads email from the learners table. DuckDB counts {{out:tables-a-query-reads:DuckDB, \"CRM\".\"LEARNERS\"}} for that name in capitals, and sqlglot lowercases it for DuckDB and Trino but keeps the capitals for PostgreSQL."

[examples.unknown-tables-denied]
say = "The code runs sqlglot's qualify step alone on a join of the learners table with the marketing audience table, which the schema doesn't hold, and gets the query back with its star unexpanded and no error. Through the enforcement layer, that join is denied, and so are a missing column, the scan behind a view, a Parquet file, a table function and a statement that isn't a query. Run directly on the layer's connection, the scan returns {{out:unknown-tables-denied:the scan, run directly}} and the table function {{out:unknown-tables-denied:the table function, run directly}}, the file read fails with a {{out:unknown-tables-denied:the file, run directly}}, and DuckDB refuses to turn external access back on."

[examples.catalog-sources-only]
say = "The code runs the allowlist's regression test: queries that read through something other than a catalog table, such as table functions, an information schema view and a CTE's name out of its scope, calls to every function DuckDB marks as having side effects, and a query the layer must allow. {{out:catalog-sources-only:cases that pass}} cases pass, and the functions with side effects are denied, {{out:catalog-sources-only:functions with side effects, denied}}. Run directly on the layer's connection, a CTE's name used before the CTE reads {{out:catalog-sources-only:a CTE's name before the CTE, run directly}} of raw learners, while through the layer, agent-a05's query with a CTE, a join and a scalar subquery returns {{out:catalog-sources-only:a CTE, a join and a scalar subquery, allowed}}."

[examples.select-list-masks-leak]
say = "The code prints the column rewrite of analyst-1's plain read of learner IDs and emails, which selects a keyed SHA-256 hash in place of the email. Then it sends five reads aimed at learner two's email through that rewrite, and none is stopped: a WHERE clause on the raw column returns learner two's ID, the row read as a struct, a column pattern and a conversion to JSON each return the stored email, and a failed cast quotes the stored email in its error. The output prints a placeholder wherever a stored email appears."

[examples.table-rewrite]
say = "The code rewrites instructor-17's query for the reviews rated two or lower, prints the rewrite and runs it. The query stays on the outside and reads from a subquery over the reviews table that keeps only the instructor's courses, passes course ID and rating as stored and the review body with emails and phone numbers replaced, each inside a condition that returns it only for those courses, and gives every other column a typed null. It returns {{out:table-rewrite:reviews returned}} reviews, and {{out:table-rewrite:of them holding an email}} of them hold an email."

[examples.table-rewrite-holds]
say = "The code sends analyst-1's five reads through the table rewrite again, by way of the answer function a service calls. The WHERE clause on the raw column finds no rows, the struct, column pattern and JSON reads each return null, and the cast error reaches the analyst only as a generic message that the query failed, while the platform team's log gets DuckDB's message, which holds a pseudonym rather than an email. A relation from the layer, asked to run SQL of its own, still returns the stored email, so the answer function returns a plain list of rows."

[examples.masks-as-sql]
say = "The code prints the SQL the enforcement layer writes for each of the four masks. Redact is a null cast to the column's type, here a date; last four keeps the last four digits of a card number once everything that isn't a digit is removed; pseudonymize is a SHA-256 hash of the key followed by the email; and redact contacts is two regular expressions that replace emails and phone numbers with placeholders. DuckDB lists {{out:masks-as-sql:DuckDB functions named like HMAC}} functions named like HMAC."

[examples.pseudonym-key]
say = "The code takes the pseudonyms analyst-1 sees in the learners table and hashes every stored email to look for it among them: without the key the hashes match {{out:pseudonym-key:pseudonyms matched from a list of emails, without the key}}, and with the key they match {{out:pseudonym-key:pseudonyms matched from a list of emails, with the key}}. Then it rotates the key, and {{out:pseudonym-key:pseudonyms that change when the key is rotated}} pseudonyms change."

[examples.redact-contacts-recall]
say = "The code applies the redact contacts mask to every ticket and review, and counts how many of the personal details the generator placed in them, labelled by type, are still in the masked text. The tickets keep {{out:redact-contacts-recall:tickets, EMAIL_ADDRESS, left in the text}} emails, {{out:redact-contacts-recall:tickets, PHONE_NUMBER, left in the text}} phone numbers and {{out:redact-contacts-recall:tickets, PERSON, left in the text}} names, and the reviews keep {{out:redact-contacts-recall:reviews, EMAIL_ADDRESS, left in the text}} emails and {{out:redact-contacts-recall:reviews, PERSON, left in the text}} names. The phone pattern makes {{out:redact-contacts-recall:[phone] replacements in tickets}} replacements in the tickets, and takes their card numbers, IBANs and dates with it."

[examples.row-filters-from-data]
say = "The code prints the condition the enforcement layer writes for each row filter: support region equal to EMEA for agent-a05's tickets, course ID in a list of instructor-17's courses for their reviews, and, for assistant-1's reviews, a learner ID among the learners whose AI-training consent is true. A region value written to look like SQL comes out as one quoted string. The assistant reads {{out:row-filters-from-data:reviews the assistant reads}} reviews; by their author's consent, {{out:row-filters-from-data:reviews whose author's AI-training consent is true}} reviews have a yes, {{out:row-filters-from-data:reviews whose author's AI-training consent is false}} a no and {{out:row-filters-from-data:reviews whose author's AI-training consent is never asked}} no answer, and the assistant's own read of the learners table is denied, since none of its groups may read it."

[examples.row-filter-order]
say = "The code runs the evaluation-order test for each filter shape the layer writes: an equality, a list of values and a consent semi-join. Each gets a copy of its table whose body holds digits in the rows the filter keeps and text in the rows it drops, and a query that casts the body to a number, once over the filter in a WHERE clause alone and once over the layer's subquery. With the WHERE clause alone, the cast sees a dropped row's value under the consent semi-join; as the layer writes it, {{out:row-filter-order:filter shapes the layer's subquery keeps safe}} shapes are safe."

[examples.who-sees-what-in-queries]
say = "The code runs chapter five's who-sees-what cases as queries through the enforcement layer, each as its user, and compares what comes back with what's stored: how many rows, and which columns hold changed values. Each case prints its rows and changed columns, or a denial, and what users get agrees with the decision in {{out:who-sees-what-in-queries:cases where what the user gets agrees with the decision}} cases. Then marketing-1 reads the marketing audience table, which has no metadata, and gets {{out:who-sees-what-in-queries:marketing-1, marketing.audience, which has no metadata, rows}} rows with {{out:who-sees-what-in-queries:marketing-1, marketing.audience, which has no metadata, columns with a value}} columns holding a value."

[examples.group-change-caught]
say = "The code adds analyst-1 to the support group, with the region EMEA, in memory, and runs the who-sees-what cases as queries again: {{out:group-change-caught:cases that fail}} cases fail. The failing cases are the analyst's read of the learners table and their reads of the reviews, with and without the AI-training purpose, and in each no column comes back changed where the case expects a mask. Chapter five's check of the decisions fails on {{out:group-change-caught:cases that fail as decisions}} too."

[examples.small-groups-difference]
say = "The code reads the minimum group size, {{out:small-groups-difference:minimum group size}}, and builds instructor-17's report of learners and average progress per course and learner country. It counts the report's cells, those under the minimum and those of one learner, then matches each cell of one against the enrollments the instructor may read, which names {{out:small-groups-difference:learners a cell of one names}} learners exactly; with the minimum, {{out:small-groups-difference:cells shown with the minimum}} cells are shown. An enrollment that arrives alone in its course on its day, into a cell already shown, still reveals its learner's country: {{out:small-groups-difference:learners whose country the daily report reveals anyway}} learners."

[examples.trino-requests]
say = "The code builds requests in the shapes Trino 484's OPA plugin sends and gives them to the platform's policy. Its allow rule answers {{out:trino-requests:allow, ExecuteQuery, agent-a05}} for the check Trino makes before any query runs, and {{out:trino-requests:allow, AccessCatalog, agent-a05}} for the check on a catalog. The row-filter rule alone returns agent-a05's and instructor-17's filters but none for agent-new, a support agent with no region yet, while the answer taken from the decision writes each filter in Trino's SQL and gives agent-new a filter that keeps no rows; a column-mask request as sent gets no mask, and translated into a read of that column, it gets the pseudonymize mask."

[examples.assistant-on-behalf]
say = "The code gives the course assistant a query tool that takes the user from the signed-in session, and runs the assistant's query, the reviews and average rating per course, once as instructor-17 and once as assistant-1. As the instructor, it covers {{out:assistant-on-behalf:run as instructor-17, courses in the answer}} courses and {{out:assistant-on-behalf:run as instructor-17, reviews behind it}} reviews, {{out:assistant-on-behalf:run as instructor-17, instructor-17's reviews behind it}} of them the instructor's own; as the assistant, it covers {{out:assistant-on-behalf:run as assistant-1, courses in the answer}} courses and {{out:assistant-on-behalf:run as assistant-1, reviews behind it}} reviews, {{out:assistant-on-behalf:run as assistant-1, instructor-17's reviews behind it}} of them the instructor's."

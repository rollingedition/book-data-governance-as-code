# Spoken descriptions for chapter 2, A catalog you can test. Narration reads these in place of the code, its output and
# the chapter's tables.

[[tables]]
section = "keep-metadata-in-a-reviewed-file"
starts = '| Classification | Meaning | On the platform |'
say = "The table lists the four classifications from least to most protected, each with its meaning and an example from the platform. Public may be shown to anyone outside the platform, such as a course's title. Internal is for staff and doesn't identify a person by itself, such as when an enrollment started. Personal identifies a person or tells something about one, such as a learner's email or text they wrote. Sensitive is data whose leak would directly harm someone, such as a card number or an instructor's bank account."

[examples.metadata-model]
say = "The code loads the metadata file and counts what it describes: {{out:metadata-model:tables described}} tables and {{out:metadata-model:columns described}} columns, of which {{out:metadata-model:columns classified public}} are public, {{out:metadata-model:columns classified internal}} internal, {{out:metadata-model:columns classified personal}} personal and {{out:metadata-model:columns classified sensitive}} sensitive, with {{out:metadata-model:teams that own tables}} owning teams. Then it prints the learners table's owner, {{out:metadata-model:crm.learners owner}}, its domain, {{out:metadata-model:crm.learners domain}}, and four of its columns with their classifications and descriptions: the learner ID and the country are internal, the email and the city personal."

[examples.rename-orphans-name-keys]
say = "The code builds a catalog holding the learners table and renames its email column to contact email, which keeps field ID {{out:rename-orphans-name-keys:contact_email field ID}} and still reads its values, {{out:rename-orphans-name-keys:values read under the new name}}. Looked up by name, the column has no classification and the old name's entry matches no column, while looked up by field ID it is still personal. The check reports it as renamed since it was reviewed, and the access policy, which reads classifications by name, redacts it for a support agent."

[examples.apply-metadata]
say = "The code builds a fresh catalog of the platform's source tables and writes the metadata file into it, which changes {{out:apply-metadata:tables changed}} tables. The learners table's schema ID goes from {{out:apply-metadata:crm.learners schema ID before}} to {{out:apply-metadata:crm.learners schema ID after}}, the email column's description appears both in the Iceberg schema and in the Arrow schema a scan returns, and the table's properties hold its domain and owner. Applying the file a second time changes {{out:apply-metadata:tables changed by applying again}} tables."

[examples.doc-edit-schema-id]
say = "The code writes the metadata file into a catalog holding the reviews table, then changes the description of its body column and nothing else. The schema ID goes from {{out:doc-edit-schema-id:schema ID before the edit}} to {{out:doc-edit-schema-id:schema ID after the edit}}, and the table keeps {{out:doc-edit-schema-id:schemas the table keeps}} schemas, while a comparison of each column's field ID, name and type finds nothing changed."

[examples.metadata-gaps]
say = "The code runs the platform's four pipelines on a fresh catalog, creating the course performance and learner activity tables in analytics, the marketing audience and the AI review corpus, then checks the catalog against the metadata file. The catalog holds {{out:metadata-gaps:tables in the catalog}} tables, and the check finds {{out:metadata-gaps:problems found}} problems: the review corpus and the marketing audience have no metadata."

[examples.schema-changes-checked]
say = "The code builds a catalog holding the learners table, adds a preferred name column with a description but no classification, then drops the country column and adds it back. The country column returns as field {{out:schema-changes-checked:country field ID, after it was added back}} instead of field {{out:schema-changes-checked:country field ID, before it was dropped}}, and a plain scan of it returns {{out:schema-changes-checked:country values after it was added back}} rows, while time travel to the snapshot the rows were written in reads the countries back, {{out:schema-changes-checked:country values, read by time travel to that snapshot}}. The check reports the preferred name and the new country column as not classified, and the dropped check reports that the old country field's entry describes a column the table no longer has."

[examples.pseudonymous-learner-id]
say = "The code finds a learner ID column in {{out:pseudonymous-learner-id:tables with a learner_id column}} of the tables the metadata file describes, classified internal in all of them, and joins the enrollments table to the learners table, which gives {{out:pseudonymous-learner-id:enrollments whose learner_id leads to an email}} enrollments an email. Then it asks the access policy which users see learners' full names unmasked: the support agents and marketing. Of them, only the support agents also read a learner ID in another table, the support tickets table."

[examples.suggestion-agreement]
say = "The code reads the recorded model's answers for {{out:suggestion-agreement:columns the model was asked about}} columns of the source tables and compares each classification with the reviewed one in the metadata file. {{out:suggestion-agreement:answers that parse as the JSON asked for}} answers parse as the JSON asked for, {{out:suggestion-agreement:answers with one of the four classifications}} name one of the four classifications, and agreement with the review is {{out:suggestion-agreement:classifications that agree with the review}}. Yet the model calls {{out:suggestion-agreement:personal columns the model called personal}} personal columns personal, and {{out:suggestion-agreement:sensitive columns the model called sensitive}} sensitive columns sensitive."

[examples.suggestions-with-platform-examples]
say = "The code compares the recorded answers under two prompts: the book's, whose examples come from outside the platform, and one whose examples are the platform's own columns. With the platform's columns as examples, the model calls {{out:suggestions-with-platform-examples:the prompt with the platform's columns as examples, sensitive columns called sensitive}} sensitive columns sensitive, against {{out:suggestions-with-platform-examples:the book's prompt, sensitive columns called sensitive}} under the book's prompt, where it calls the card number and the payout account internal. Agreement with the review goes from {{out:suggestions-with-platform-examples:the book's prompt, classifications that agree with the review}} to {{out:suggestions-with-platform-examples:the prompt with the platform's columns as examples, classifications that agree with the review}}, and personal columns called personal stay at {{out:suggestions-with-platform-examples:the prompt with the platform's columns as examples, personal columns called personal}}."

[examples.suggestion-mistakes]
say = "The code ranks each recorded classification against the reviewed one, from public up to sensitive, and counts the misses in each direction: {{out:suggestion-mistakes:columns the model protects less than the review}} columns the model protects less than the review, and {{out:suggestion-mistakes:columns the model protects more than the review}} it protects more. Then it lists the columns of each kind of miss, the most protected first: {{out:suggestion-mistakes:sensitive columns the model called internal}} sensitive and {{out:suggestion-mistakes:personal columns the model called internal}} personal columns called internal, among them names, emails and the text of tickets, and {{out:suggestion-mistakes:personal columns the model called public}} personal columns called public: a learner's city and street address, and the text of reviews."

[examples.suggestion-descriptions]
say = "The code prints the model's description beside the reviewed one for four columns: the learners table's AI training consent, support region and notes, and the payments table's card number. The model writes that the learner consented to receive AI training, that support region is a regional support area, that the notes come from learners, and that card numbers are stored for payment processing. The reviewed ones say the consent is to the learner's text training the platform's AI, that the region is the support team serving the learner, that support agents write the notes, and that the card number should not be stored at all."

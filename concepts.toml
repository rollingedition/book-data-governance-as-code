# The terms this book defines, each quoted from the sentence that defines it (writing standards W-77 to W-80).

context = "data-engineering"

[[concepts]]
id = "shared-module"
term = "shared module"
aliases = ["shared modules"]
definition = "The shared modules, files in `examples/lib/` that hold the code many examples need, are yours to open and read"
section = "governance-end-to-end"

[concepts.relations]
same-as = ["https://rollingedition.com/concepts/artificial-intelligence/shared-module"]

[[concepts]]
id = "catalog"
term = "catalog"
context = "data-governance"
definition = "A catalog lists a platform's tables and their schemas"
section = "catalog-a-table"
example = "catalog-the-learners"

[[concepts]]
id = "migration"
term = "migration"
context = "data-warehousing"
definition = "A schema change on the platform is a migration, an `alter table` statement in a file in the branch's `migrations/` folder."
section = "fail-the-pull-request"
example = "unclassified-column-fails"

[[concepts]]
id = "coverage-check"
term = "coverage check"
context = "data-governance"
definition = "The coverage check is the catalog check, `lib.metadata.problems`, run on the branch's platform, and for each column nobody classified it adds what a rule on column names suggests"
section = "fail-the-pull-request"
example = "unclassified-column-fails"

[[concepts]]
id = "platform-team"
term = "platform team"
context = "data-governance"
definition = "the platform team, the team answerable for tables without an owner"
section = "fail-the-pull-request"
example = "unclassified-column-fails"

[[concepts]]
id = "metadata"
term = "metadata"
context = "data-governance"
definition = "A catalog's metadata is what you know about each table that the data doesn't say: who owns it, which part of the business it belongs to, what it holds, and how each column must be protected."
section = "keep-metadata-in-a-reviewed-file"
example = "metadata-model"

[[concepts]]
id = "owner"
term = "owner"
context = "data-governance"
definition = "an owner, the team answerable for the table, never a person"
section = "keep-metadata-in-a-reviewed-file"
example = "metadata-model"

[concepts.relations]
part-of = ["metadata"]

[[concepts]]
id = "domain"
term = "domain"
context = "data-governance"
definition = "a domain, the part of the business the table belongs to"
section = "keep-metadata-in-a-reviewed-file"
example = "metadata-model"

[concepts.relations]
part-of = ["metadata"]

[[concepts]]
id = "classification"
term = "classification"
aliases = ["classifications"]
context = "data-governance"
definition = "A classification is one of four values, ordered from least to most protected"
section = "keep-metadata-in-a-reviewed-file"
example = "metadata-model"

[concepts.relations]
part-of = ["metadata"]

[[concepts]]
id = "field-id"
term = "field ID"
aliases = ["field IDs"]
context = "data-warehousing"
definition = "Iceberg gives every column a field ID, an integer unique within the table's schema"
section = "key-column-metadata-by-field-id"
example = "rename-orphans-name-keys"
applies_to = ["pyiceberg"]

[concepts.relations]
same-as = ["https://rollingedition.com/concepts/data-engineering/field-id"]

[[concepts]]
id = "doc"
term = "doc"
context = "data-warehousing"
definition = "each column can carry a `doc`, an optional comment that travels with the schema"
section = "write-descriptions-into-the-schema"
example = "apply-metadata"
applies_to = ["pyiceberg"]

[[concepts]]
id = "table-property"
term = "table property"
aliases = ["table properties"]
context = "data-warehousing"
definition = "A table also has properties, a map of strings"
section = "write-descriptions-into-the-schema"
example = "apply-metadata"
applies_to = ["pyiceberg"]

[[concepts]]
id = "catalog-label"
term = "catalog label"
aliases = ["labels"]
context = "data-warehousing"
definition = "`labels`, ownership or classification that a catalog returns with a table, per table and per field ID, kept out of properties on purpose"
section = "write-descriptions-into-the-schema"

[concepts.relations]
contrasts-with = ["table-property"]

[[concepts]]
id = "pseudonymous-identifier"
term = "pseudonymous identifier"
aliases = ["pseudonymous ID", "pseudonymous IDs"]
context = "data-governance"
definition = "An ID with no meaning of its own, such as `learner_id`, is a pseudonymous identifier: it doesn't name anyone, but it leads to someone through another table."
section = "classify-pseudonymous-ids"
example = "pseudonymous-learner-id"

[[concepts]]
id = "greedy-decoding"
term = "greedy decoding"
definition = "The script decodes greedily, taking the most likely next token"
section = "draft-descriptions-with-a-local-model"

[concepts.relations]
same-as = ["https://rollingedition.com/concepts/large-language-models/greedy-decoding"]

[[concepts]]
id = "model-draft"
term = "model draft"
aliases = ["model drafts"]
context = "data-governance"
definition = "a model's draft is a proposal that a person accepts, corrects or rejects in the pull request"
section = "draft-descriptions-with-a-local-model"
example = "suggestion-agreement"

[[concepts]]
id = "recording-manifest"
term = "recording manifest"
context = "data-governance"
definition = "The recording's manifest names the model, its revision, a hash of the prompts and settings, and the date, so anyone can record again and compare."
section = "draft-descriptions-with-a-local-model"

[[concepts]]
id = "truth"
term = "truth"
context = "data-governance"
definition = "Every detector in this chapter is measured against one file, which we call the truth: `data/platform/pii_spans.parquet`."
section = "finding-personal-data"

[[concepts]]
id = "recognizer"
term = "recognizer"
aliases = ["recognizers"]
context = "data-governance"
definition = "Presidio's analyzer runs recognizers: regular expressions with checksums, phone-number parsing, and a named-entity model reached through an NLP engine."
section = "run-presidio-offline"
example = "presidio-offline-engine"
applies_to = ["presidio-analyzer"]

[concepts.relations]
implemented-by = [{ to = "presidio-analyzer", versions = ">=2.2" }]

[[concepts]]
id = "nlp-engine"
term = "NLP engine"
context = "data-governance"
definition = "The NLP engine does two jobs, named-entity recognition and feature extraction for rules, such as the context words that raise a score."
section = "run-presidio-offline"
example = "presidio-offline-engine"
applies_to = ["presidio-analyzer"]

[[concepts]]
id = "exact-matching"
term = "exact matching"
context = "data-governance"
definition = "Exact matching, from the CoNLL-2003 shared task, counts an entity \"correct only if it is an exact match of the corresponding entity in the data file\""
section = "measure-against-labelled-spans"
example = "measure-pattern-recognizers"

[concepts.relations]
contrasts-with = ["overlap-matching"]
measured-from = ["truth"]

[[concepts]]
id = "overlap-matching"
term = "overlap matching"
context = "data-governance"
definition = "Overlap matching asks only for one shared character, with a label of its type"
section = "measure-against-labelled-spans"
example = "measure-pattern-recognizers"

[concepts.relations]
measured-from = ["truth"]

[[concepts]]
id = "coverage"
term = "coverage"
context = "data-governance"
definition = "`lib.pii` adds a third measure, coverage: whether every character of a labelled span is inside some detection, whatever its label."
section = "measure-against-labelled-spans"
example = "measure-pattern-recognizers"

[concepts.relations]
measured-from = ["truth"]

[[concepts]]
id = "recall"
term = "recall"
context = "data-governance"
definition = "recall, the share of labelled spans of each type that a detector finds with a label of that type"
section = "measure-against-labelled-spans"
example = "measure-pattern-recognizers"

[concepts.relations]
measured-from = ["truth"]
close-to = ["https://rollingedition.com/concepts/llm-evaluation/true-positive-rate"]

[[concepts]]
id = "precision"
term = "precision"
context = "data-governance"
definition = "precision, the share of each label's detections that match a labelled span"
section = "measure-against-labelled-spans"
example = "measure-pattern-recognizers"

[concepts.relations]
measured-from = ["truth"]

[[concepts]]
id = "pii"
term = "PII"
aliases = ["personally identifiable information"]
context = "data-governance"
definition = "The authors of the SPY dataset define PII as the entities that can identify, contact or locate a specific individual"
section = "compare-a-named-entity-model"
wikidata = "Q1076693"

[[concepts]]
id = "pii-model"
term = "PII model"
context = "data-governance"
definition = "We use a PII model, one trained for personally identifiable information"
section = "compare-a-named-entity-model"
example = "privacy-filter-spans"

[concepts.relations]
broader = ["pii"]

[[concepts]]
id = "lineage"
term = "lineage"
context = "data-pipelines"
definition = "Lineage is where each column's data came from, and where it goes."
section = "lineage-from-pipelines"
wikidata = "Q1172162"

[[concepts]]
id = "job"
term = "job"
aliases = ["jobs"]
context = "data-pipelines"
definition = "A job is \"a process that consumes or produces Datasets\", such as a pipeline."
section = "send-run-events"
example = "pipeline-run-events"

[[concepts]]
id = "run"
term = "run"
aliases = ["runs"]
context = "data-pipelines"
definition = "A run is one occurrence of a job, identified by a UUID the client generates, and the spec recommends UUIDv7."
section = "send-run-events"
example = "pipeline-run-events"

[concepts.relations]
part-of = ["job"]

[[concepts]]
id = "dataset"
term = "dataset"
aliases = ["datasets"]
context = "data-pipelines"
definition = "A dataset is a table or file, named by a namespace and a name that together identify it."
section = "send-run-events"
example = "pipeline-run-events"

[[concepts]]
id = "run-event"
term = "run event"
aliases = ["run events"]
context = "data-pipelines"
definition = "A run reports itself through run events: a START when it begins, then one terminal event, COMPLETE, FAIL or ABORT"
section = "send-run-events"
example = "pipeline-run-events"

[[concepts]]
id = "facet"
term = "facet"
aliases = ["facets"]
context = "data-pipelines"
definition = "A facet is OpenLineage's name for a block of metadata attached to a run, a job or a dataset"
section = "send-run-events"
example = "pipeline-run-events"

[[concepts]]
id = "column-lineage"
term = "column lineage"
context = "data-pipelines"
definition = "Column lineage says which input columns each output column came from, and that is what governance needs"
section = "trace-output-columns"
example = "sqlglot-misses-row-inputs"

[concepts.relations]
contrasts-with = ["run-event"]

[[concepts]]
id = "column-lineage-facet"
term = "columnLineage facet"
context = "data-pipelines"
definition = "OpenLineage puts column lineage in a dataset facet, `columnLineage`, on the output: `fields` maps each output column to its `inputFields`, and an optional `dataset` list holds inputs that affect the whole dataset"
section = "trace-output-columns"
example = "indirect-column-lineage"

[concepts.relations]
broader = ["facet"]
computed-from = ["column-lineage"]

[[concepts]]
id = "direct-input"
term = "DIRECT"
aliases = ["DIRECT input"]
context = "data-pipelines"
definition = "DIRECT means the output value is derived from the input value, through IDENTITY, TRANSFORMATION or AGGREGATION."
section = "add-indirect-inputs"
example = "indirect-column-lineage"

[concepts.relations]
contrasts-with = ["indirect-input"]

[[concepts]]
id = "indirect-input"
term = "INDIRECT"
aliases = ["INDIRECT input"]
context = "data-pipelines"
definition = "INDIRECT means the output value is impacted by an input without being derived from it, through JOIN, GROUP_BY, FILTER, SORT, WINDOW or CONDITIONAL."
section = "add-indirect-inputs"
example = "indirect-column-lineage"

[concepts.relations]
contrasts-with = ["direct-input"]

[[concepts]]
id = "implicit-flow"
term = "implicit flow"
context = "data-governance"
definition = "Denning calls the information that flows through conditions \"implicit flow\": a statement that assigns only when a condition holds still tells you the condition's value"
section = "add-indirect-inputs"

[[concepts]]
id = "masking-flag"
term = "masking flag"
context = "data-pipelines"
definition = "OpenLineage's `masking` flag says only that a value was obfuscated, such as by a hash"
section = "classifications-from-lineage"

[[concepts]]
id = "lineage-graph"
term = "lineage graph"
context = "data-pipelines"
definition = "With column lineage in every COMPLETE event, the platform has a graph: columns are nodes, and each input field is an edge to the column or table it feeds."
section = "impact-of-a-column-change"
example = "column-impact"

[concepts.relations]
computed-from = ["column-lineage"]

[[concepts]]
id = "impact-analysis"
term = "impact analysis"
context = "data-pipelines"
definition = "Impact analysis asks what a change to one column can break."
section = "impact-of-a-column-change"
example = "column-impact"

[concepts.relations]
computed-from = ["lineage-graph"]

[[concepts]]
id = "policy"
term = "policy"
aliases = ["policies"]
context = "data-governance"
definition = "A policy is code that answers whether a request may go ahead."
section = "access-policies-as-code"

[[concepts]]
id = "decision"
term = "decision"
aliases = ["decisions"]
context = "data-governance"
definition = "A decision is a policy's answer."
section = "access-policies-as-code"

[[concepts]]
id = "principal"
term = "principal"
aliases = ["principals"]
context = "data-governance"
definition = "The principal is who asks"
section = "access-policies-as-code"
agrees = [{ book = "business-intelligence-with-agents", definition = "the principal, meaning whoever your sign-in system says is asking" }]

[[concepts]]
id = "role"
term = "role"
aliases = ["roles"]
context = "data-governance"
definition = "a role is a group of principals with the same job"
section = "access-policies-as-code"

[concepts.relations]
broader = ["attribute"]

[[concepts]]
id = "attribute"
term = "attribute"
aliases = ["attributes"]
context = "data-governance"
definition = "an attribute is any other fact a rule reads, about the principal, the data or the request"
section = "access-policies-as-code"

[[concepts]]
id = "row-filter"
term = "row filter"
aliases = ["row filters"]
context = "data-governance"
definition = "A row filter limits which rows a query returns"
section = "access-policies-as-code"
example = "attributes-as-row-filters"
agrees = [{ book = "business-intelligence-with-agents", definition = "A row filter takes the decision away from the model: a condition on a table, such as region = 'EMEA', that every query reading the table gets, whatever else the query says." }]

[concepts.relations]
part-of = ["decision-document"]

[[concepts]]
id = "column-mask"
term = "column mask"
aliases = ["column masks"]
context = "data-governance"
definition = "a column mask changes how a column's values are shown"
section = "access-policies-as-code"
example = "one-decision-document"
agrees = [{ book = "business-intelligence-with-agents", definition = "A column mask decides what a role sees in a column: the value replaced by something that reveals nothing, here the text (masked)." }]

[concepts.relations]
part-of = ["decision-document"]

[[concepts]]
id = "pseudonymization"
term = "pseudonymization"
context = "data-governance"
definition = "pseudonymization, which replaces an identifier with a consistent stand-in"
section = "access-policies-as-code"

[concepts.relations]
broader = ["column-mask"]

[[concepts]]
id = "policy-input"
term = "input"
context = "data-governance"
definition = "The service sends a JSON document describing the request, and the policy reads it as `input`."
section = "shape-the-request-like-trinos"
example = "trino-shaped-request"

[[concepts]]
id = "data-document"
term = "data document"
context = "data-governance"
definition = "Everything else a rule needs besides the request, such as each user's groups and each column's classification, comes from a second document, which OPA calls `data`."
section = "generate-the-data-the-policy-reads"
example = "generated-policy-data"

[concepts.relations]
contrasts-with = ["policy-input"]

[[concepts]]
id = "undefined"
term = "undefined"
context = "data-governance"
definition = "A rule whose body never evaluates to true has no value, which Rego calls undefined"
section = "deny-by-default-then-allow-by-role"
example = "regopy-silent-differences"

[[concepts]]
id = "fail-safe-defaults"
term = "fail-safe defaults"
context = "data-governance"
definition = "Saltzer and Schroeder's principle of fail-safe defaults is to \"Base access decisions on permission rather than exclusion\""
section = "deny-by-default-then-allow-by-role"

[[concepts]]
id = "deny-by-default"
term = "deny by default"
aliases = ["default deny"]
context = "data-governance"
definition = "With `default allow := false`, a request that no `allow` rule matches is denied, whoever sends it and whatever it asks for."
section = "deny-by-default-then-allow-by-role"
example = "allow-by-role"
agrees = [{ book = "business-intelligence-with-agents", definition = "Deny by default means that any table a filtered role's filter doesn't name or list as unfiltered is refused, so a mart added later stays closed to the lead until someone writes its filter." }]

[concepts.relations]
broader = ["fail-safe-defaults"]

[[concepts]]
id = "role-based-access-control"
term = "role-based access control"
aliases = ["RBAC"]
context = "data-governance"
definition = "Role-based access control, first formalized by Ferraiolo and Kuhn in 1992, grants access by the job a principal holds rather than by who they are."
section = "deny-by-default-then-allow-by-role"
example = "allow-by-role"
wikidata = "Q1702839"

[[concepts]]
id = "attribute-based-access-control"
term = "attribute-based access control"
aliases = ["ABAC"]
context = "data-governance"
definition = "NIST's guide to attribute-based access control defines the general approach, in which access is decided by attributes of the subject, the object, the requested operations and, sometimes, the environment."
section = "narrow-by-attribute"
example = "attributes-as-row-filters"
wikidata = "Q4818708"

[[concepts]]
id = "role-explosion"
term = "role explosion"
context = "data-governance"
definition = "The alternative, a role for every combination, is what NIST's guide calls \"role explosion\"."
section = "narrow-by-attribute"

[concepts.relations]
contrasts-with = ["attribute-based-access-control"]

[[concepts]]
id = "purpose"
term = "purpose"
context = "data-governance"
definition = "The purpose is an attribute of the request."
section = "narrow-by-attribute"
example = "attributes-as-row-filters"

[concepts.relations]
broader = ["attribute"]

[[concepts]]
id = "decision-document"
term = "decision document"
context = "data-governance"
definition = "The platform's policy uses structured data to return its whole answer as one document, `data.platform.access.decision`, with four keys: `allow`, the `row_filters`, the `column_masks`, and the `reasons`."
section = "return-the-decision-as-one-document"
example = "one-decision-document"

[concepts.relations]
broader = ["decision"]

[[concepts]]
id = "policy-test"
term = "policy test"
aliases = ["policy tests"]
context = "data-governance"
definition = "a test is a rule whose name is prefixed with `test_`"
section = "unit-test-the-policy-in-rego"
example = "policy-unit-tests"

[[concepts]]
id = "decision-table"
term = "decision table"
aliases = ["who-sees-what table"]
context = "data-governance"
definition = "A decision table is one row per request, saying who reads which table and what they must get back, in the terms of their job."
section = "check-who-sees-what"
example = "who-sees-what"

[[concepts]]
id = "cedar-schema"
term = "Cedar schema"
context = "data-governance"
definition = "A schema declares every type of entity, the kinds of principal and resource a request can name, with its attributes"
section = "the-same-rules-in-cedar"
example = "cedar-same-rules"

[concepts.relations]
prerequisite-of = ["policy-validation"]

[[concepts]]
id = "policy-validation"
term = "policy validation"
aliases = ["validation"]
context = "data-governance"
definition = "Validation checks policies against a schema before any request"
section = "the-same-rules-in-cedar"
example = "cedar-same-rules"

[[concepts]]
id = "skip-on-error"
term = "skip on error"
context = "data-governance"
definition = "skip on error, which the documentation defines as \"if a policy's evaluation returns error, the policy does not factor into the authorization response; it is skipped\""
section = "the-same-rules-in-cedar"
example = "cedar-missing-region"

[[concepts]]
id = "partial-evaluation"
term = "partial evaluation"
context = "data-governance"
definition = "Cedar's experimental partial evaluation, which returns residual policies for the parts it can't yet decide, and whose result is not a final authorization decision"
section = "the-same-rules-in-cedar"

[concepts.relations]
contrasts-with = ["decision"]

[[concepts]]
id = "enforcement-layer"
term = "enforcement layer"
context = "data-governance"
definition = "The book's shared module `lib.enforce` enforces decisions; we call it the enforcement layer."
section = "enforcing-policies-on-queries"

[[concepts]]
id = "qualify"
term = "qualify"

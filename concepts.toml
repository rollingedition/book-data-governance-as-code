example = "catalog-sources-only"

[[concepts]]
id = "table-rewrite"
term = "table rewrite"
context = "data-governance"
definition = "`Enforcer.rewrite` replaces each catalog table in the query, under the query's own alias for it, with a subquery built from the user's decision"

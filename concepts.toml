definition = "`redact` is a `NULL` cast to the column's type, so the column keeps its type for anything the query does with it, such as a union or a date function."
section = "write-masks-as-sql"
example = "masks-as-sql"

[concepts.relations]
broader = ["column-mask"]

[[concepts]]
id = "last4"
term = "last4"
context = "data-governance"
definition = "`last4` keeps the last four digits of a card number, after removing anything that isn't a digit."
section = "write-masks-as-sql"
example = "masks-as-sql"

[concepts.relations]
broader = ["column-mask"]

[[concepts]]
id = "pseudonymize"
term = "pseudonymize"
aliases = ["keyed hash"]
context = "data-governance"
definition = "`pseudonymize` is a keyed hash, SHA-256 over the key followed by the value"
section = "write-masks-as-sql"
example = "pseudonym-key"

[concepts.relations]
broader = ["column-mask"]

[[concepts]]
id = "redact-contacts"
term = "redact_contacts"
context = "data-governance"
definition = "`redact_contacts` replaces emails and phone numbers in free text with `[email]` and `[phone]`."
section = "write-masks-as-sql"
example = "redact-contacts-recall"

[concepts.relations]
broader = ["column-mask"]

[[concepts]]
id = "semi-join"

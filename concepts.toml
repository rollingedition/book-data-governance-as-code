[concepts.relations]
implemented-by = [{ to = "sqlglot", versions = ">=30.24" }]
same-as = ["https://rollingedition.com/concepts/artificial-intelligence/column-qualification"]

[[concepts]]
id = "source-allowlist"
term = "source allowlist"
context = "data-governance"
